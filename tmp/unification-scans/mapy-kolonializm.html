body{font:16px system-ui;margin:0;background:#f5f7fb;color:#192839;padding:24px}
main{max-width:1160px;margin:auto}h1{font-size:1.75rem;margin:0 0 8px}h2{font-size:1.2rem;margin:0 0 8px}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
section{padding:16px;background:white;border:1px solid #d6dde4;border-radius:12px;display:flex;flex-direction:column}
section p{margin:0 0 10px}.quiz-map{height:440px;background:#d7ebf4;border-radius:8px;margin-top:auto}.feedback{min-height:1.4em;padding-top:8px}
[role=button]:focus-visible{outline:3px solid #16263b}
@media(max-width:780px){.maps{grid-template-columns:1fr}.quiz-map{height:380px}}

questions.forEach(({bounds,target,geojson}, i) => {
    const map = L.map("map-" + i, {zoomSnap:0.25,scrollWheelZoom:false});
    map.fitBounds(bounds, {padding:[10,10]});
    L.geoJSON(background,{interactive:false,attribution:"Natural Earth",style:{color:"#84989b",weight:1,fillColor:"#edf1e8",fillOpacity:1}}).addTo(map);
    const choices = L.geoJSON(geojson,{style:normal}).addTo(map);
    choices.eachLayer(layer => {
        const path = layer.getElement();
        path.setAttribute("tabindex","0");
        path.setAttribute("role","button");
        path.setAttribute("aria-label",layer.feature.properties.name);
        const select = () => {
            const correct = layer.feature.id === target;
            choices.resetStyle();
            layer.setStyle({fillColor:correct ? "#3a9968" : "#d98061",fillOpacity:1});
            document.getElementById("feedback-" + i).textContent = correct ? "Dobrze! " + layer.feature.properties.name + "." : "To " + layer.feature.properties.name + ". Spróbuj jeszcze raz.";
        };
        layer.on("click",select);
        path.addEventListener("keydown",event => {
            if(event.key === "Enter" || event.key === " ") {event.preventDefault();event.stopPropagation();select();}
        });
    });
});
