services:
  backend:
    build:
      context: ./backend
      provenance: false
    restart: unless-stopped
    environment:
      APP_ENV: prod
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "pbkdf2_sha256$$260000$$KcfkKY3bkM_ySjy-f-ge_w==$$TXqRVaefuUGxrjq42weO9ArnfRyjpkUPkOaKH6q9N6A="
    volumes:
      - ./backend/app/data/chapters:/app/app/data/chapters
      - ./backend/app/static:/app/app/static
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  llm-checker:
    build:
      context: ../LLM_server
      provenance: false
    restart: unless-stopped
    env_file:
      - ../LLM_server/.env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      provenance: false
    restart: unless-stopped
    environment:
      API_BASE_URL: ""
      LLM_API_BASE_URL: "/llm-api"
    ports:
      - "8082:80"
    depends_on:
      - backend
      - llm-checker
