server {
    listen 80;
    server_name localhost;
    # A 5 MB image becomes roughly 6.7 MB when encoded in a JSON Base64 payload.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets must never fall through to the SPA document. A missing
    # asset should be a clear 404 instead of HTML served with a JavaScript MIME
    # error after a frontend deployment.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML points to the current hashed assets, so browsers should revalidate it
    # after every deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /js/config.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /llm-api/ {
        proxy_pass http://llm-checker:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }
}
